<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Math Quiz - Kiddo Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<style>
  .question {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--purple);
    margin: 20px 0;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    max-width: 400px;
    margin: 0 auto;
  }
  .choice-btn {
    background: var(--yellow);
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 1.5rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  .choice-btn:hover { transform: scale(1.05); }
  .choice-btn.correct { background: var(--green); color: white; }
  .choice-btn.wrong { background: var(--pink); color: white; }
  .level-select { margin-bottom: 16px; }
  .level-select button {
    margin: 0 4px;
  }
  .level-select button.active {
    background: var(--purple);
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">🎈 Kiddo Playground</div>
  <nav>
    <a href="../index.html">Home</a>
  </nav>
</header>

<main class="game-page">
  <h1>➕ Math Quiz</h1>
  <p>Answer as many questions as you can!</p>

  <div class="game-stage">
    <div class="level-select">
      <button class="btn secondary active" data-level="easy">Easy</button>
      <button class="btn secondary" data-level="medium">Medium</button>
      <button class="btn secondary" data-level="hard">Hard</button>
    </div>
    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Question: <span id="qnum">1</span> / 10</div>
    </div>
    <div class="question" id="question">?</div>
    <div class="choices" id="choices"></div>
    <div class="controls">
      <button class="btn" id="restartBtn" style="display:none;">Play Again</button>
      <a class="btn secondary" href="../index.html">Back Home</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  Made with 💜 for curious kids everywhere.
</footer>

<script>
let level = 'easy';
let score = 0;
let qIndex = 0;
const TOTAL_Q = 10;
let currentAnswer = null;
let locked = false;

const ranges = {
  easy: { max: 10, ops: ['+'] },
  medium: { max: 20, ops: ['+', '-'] },
  hard: { max: 12, ops: ['+', '-', '×'] }
};

document.querySelectorAll('.level-select button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.level-select button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    level = btn.dataset.level;
    restart();
  });
});

function randInt(max) {
  return Math.floor(Math.random() * (max + 1));
}

function newQuestion() {
  locked = false;
  const cfg = ranges[level];
  const op = cfg.ops[randInt(cfg.ops.length - 1)];
  let a = randInt(cfg.max) + 1;
  let b = randInt(cfg.max) + 1;

  let answer;
  if (op === '+') answer = a + b;
  else if (op === '-') {
    if (b > a) [a, b] = [b, a];
    answer = a - b;
  } else {
    a = randInt(10) + 1;
    b = randInt(10) + 1;
    answer = a * b;
  }
  currentAnswer = answer;

  document.getElementById('question').textContent = `${a} ${op} ${b} = ?`;

  const choices = new Set([answer]);
  while (choices.size < 4) {
    const offset = randInt(6) - 3;
    const wrong = answer + (offset === 0 ? 4 : offset);
    if (wrong >= 0) choices.add(wrong);
  }
  const choiceArr = [...choices].sort(() => Math.random() - 0.5);

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  choiceArr.forEach(val => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = val;
    btn.addEventListener('click', () => selectAnswer(val, btn));
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(val, btn) {
  if (locked) return;
  locked = true;
  const isCorrect = val === currentAnswer;
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (isCorrect) {
    score++;
    document.getElementById('score').textContent = score;
  } else {
    [...document.querySelectorAll('.choice-btn')].forEach(b => {
      if (Number(b.textContent) === currentAnswer) b.classList.add('correct');
    });
  }

  setTimeout(() => {
    qIndex++;
    if (qIndex >= TOTAL_Q) {
      endQuiz();
    } else {
      document.getElementById('qnum').textContent = qIndex + 1;
      newQuestion();
    }
  }, 900);
}

function endQuiz() {
  document.getElementById('question').textContent = `🎉 Final score: ${score} / ${TOTAL_Q}`;
  document.getElementById('choices').innerHTML = '';
  document.getElementById('restartBtn').style.display = 'inline-block';
}

function restart() {
  score = 0;
  qIndex = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('qnum').textContent = 1;
  document.getElementById('restartBtn').style.display = 'none';
  newQuestion();
}

document.getElementById('restartBtn').addEventListener('click', restart);
restart();
</script>

</body>
</html>
