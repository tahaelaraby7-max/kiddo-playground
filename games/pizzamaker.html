<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pizza Maker - Kiddo Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<style>
  .kitchen-stage {
    max-width: 760px;
  }

  /* ===== Scene ===== */
  .kitchen-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10.5;
    margin: 6px auto 18px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 20px var(--shadow), inset 0 0 0 6px #fff;
    background: #fdf2e9;
  }
  .wall {
    position: absolute;
    inset: 0;
    height: 64%;
    background: linear-gradient(180deg, #fff6ea 0%, #f7e0c4 100%);
  }
  .floor {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 36%;
    background:
      repeating-linear-gradient(90deg, #e7c090 0 5%, #dcb27e 5% 10%);
  }

  .window {
    position: absolute;
    top: 8%;
    right: 6%;
    width: 24%;
    height: 46%;
    background: linear-gradient(180deg, #bfe3ff 0%, #eaf7ff 100%);
    border: 7px solid #fff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12), inset 0 0 0 2px #e3d3bd;
  }
  .window::before, .window::after {
    content: '';
    position: absolute;
    background: #fff;
  }
  .window::before { left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); }
  .window::after { top: 50%; left: 0; right: 0; height: 6px; transform: translateY(-50%); }
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 40%;
    opacity: 0.9;
  }

  .shelf-wrap {
    position: absolute;
    top: 10%;
    left: 5%;
    width: 30%;
  }
  .shelf {
    height: 10px;
    background: #b1783f;
    border-radius: 4px;
    box-shadow: 0 3px 4px rgba(0,0,0,0.2);
  }
  .jars {
    display: flex;
    justify-content: space-evenly;
    align-items: flex-end;
  }
  .jar {
    width: 15%;
    aspect-ratio: 0.7;
    background: rgba(255,255,255,0.55);
    border: 2px solid rgba(0,0,0,0.08);
    border-radius: 5px 5px 3px 3px;
    position: relative;
    margin-bottom: -2px;
  }
  .jar::before {
    content: '';
    position: absolute;
    top: -18%;
    left: 15%;
    right: 15%;
    height: 22%;
    background: var(--jc, var(--pink));
    border-radius: 3px 3px 0 0;
  }

  .order-note {
    position: absolute;
    top: 12%;
    left: 40%;
    width: 30%;
    background: #fff8dd;
    border: 1px solid #e8dba3;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    color: #6b5300;
    text-align: center;
    line-height: 1.35;
    transform: rotate(-3deg);
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }
  .order-note::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 16px;
    height: 8px;
    background: #ffd93d;
    opacity: 0.85;
    border-radius: 2px;
  }

  /* ===== Counter ===== */
  .counter {
    position: absolute;
    left: 24%;
    right: 0;
    bottom: 0;
    height: 42%;
  }
  .counter-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 22%;
    background: linear-gradient(180deg, #e8b877 0%, #d9a05c 100%);
    border-radius: 8px 8px 0 0;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  .cabinet-face {
    position: absolute;
    top: 22%;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(180deg, #c98a4b 0%, #a86a34 100%);
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 6% 4%;
    gap: 4%;
    border-radius: 0 0 10px 10px;
  }
  .cabinet-door {
    flex: 1;
    height: 80%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(0,0,0,0.15);
    border-radius: 6px;
    position: relative;
  }
  .cabinet-door::after {
    content: '';
    position: absolute;
    right: 10%;
    top: 50%;
    width: 8px;
    height: 8px;
    background: var(--yellow);
    border-radius: 50%;
    transform: translateY(-50%);
  }

  .oven-unit {
    flex: 1.3;
    height: 84%;
    background: #3a3a3a;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    position: relative;
  }
  .oven-window {
    width: 62%;
    aspect-ratio: 1;
    background: #171717;
    border: 3px solid #555;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    filter: grayscale(1) brightness(0.6);
    transition: filter 0.4s ease;
  }
  .oven-unit.active .oven-window {
    filter: none;
    box-shadow: 0 0 14px 4px rgba(255,140,0,0.6);
  }
  .oven-knob {
    width: 10%;
    aspect-ratio: 1;
    background: var(--orange);
    border-radius: 50%;
  }

  /* ===== Pizza pan ===== */
  .pizza-pan {
    position: absolute;
    left: 66%;
    top: 26%;
    width: 40%;
    aspect-ratio: 1;
    transform: translateX(-50%);
    background: radial-gradient(circle at 35% 30%, #7d7d7d, #4d4d4d 70%, #3a3a3a 100%);
    border-radius: 50%;
    box-shadow: 0 10px 16px rgba(0,0,0,0.35);
    padding: 6%;
  }
  .pizza-area {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #f7e2ae 0%, #eecf8e 55%, #e0b878 100%);
    border: 5% solid #d9a441;
    box-shadow:
      inset 0 0 0 3px #c9902f,
      inset 0 6px 14px rgba(180, 110, 30, 0.35);
    transition: filter 0.6s ease;
    overflow: hidden;
  }
  .pizza-area.no-dough {
    background: repeating-linear-gradient(45deg, #eee, #eee 10px, #f7f7f7 10px, #f7f7f7 20px);
    border-color: #ccc;
  }
  .pizza-area.baked {
    border-color: #b9772a;
    filter: brightness(0.96) saturate(1.15) sepia(0.12);
  }
  .pizza-area.baked::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 20% 80%, rgba(120,60,10,0.18) 0, rgba(120,60,10,0.18) 5px, transparent 6px),
      radial-gradient(circle at 75% 15%, rgba(120,60,10,0.15) 0, rgba(120,60,10,0.15) 4px, transparent 5px),
      radial-gradient(circle at 85% 70%, rgba(120,60,10,0.18) 0, rgba(120,60,10,0.18) 6px, transparent 7px),
      radial-gradient(circle at 45% 90%, rgba(120,60,10,0.15) 0, rgba(120,60,10,0.15) 4px, transparent 5px);
    pointer-events: none;
  }
  .sauce-layer, .cheese-layer {
    position: absolute;
    inset: 5%;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .sauce-layer {
    background:
      radial-gradient(circle at 35% 30%, #e15a44 0%, #cc3b2c 45%, #b52f22 100%),
      radial-gradient(circle at 70% 65%, rgba(190,50,35,0.5) 0, rgba(190,50,35,0.5) 12%, transparent 13%),
      radial-gradient(circle at 25% 70%, rgba(190,50,35,0.4) 0, rgba(190,50,35,0.4) 9%, transparent 10%);
  }
  .cheese-layer {
    background:
      radial-gradient(circle at 30% 30%, #fff1c2 0%, #ffdf85 45%, #f6c94e 100%),
      radial-gradient(circle at 65% 25%, rgba(255,255,255,0.55) 0, rgba(255,255,255,0.55) 7%, transparent 8%),
      radial-gradient(circle at 40% 65%, rgba(255,255,255,0.4) 0, rgba(255,255,255,0.4) 8%, transparent 9%),
      radial-gradient(circle at 75% 70%, rgba(220,150,30,0.35) 0, rgba(220,150,30,0.35) 6%, transparent 7%),
      radial-gradient(circle at 20% 55%, rgba(220,150,30,0.3) 0, rgba(220,150,30,0.3) 5%, transparent 6%);
  }
  .sauce-layer.on { opacity: 1; }
  .cheese-layer.on { opacity: 0.92; }
  .topping {
    position: absolute;
    font-size: 1.5rem;
    transform: translate(-50%, -50%);
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }

  /* ===== Chef girl ===== */
  .chef-girl {
    position: absolute;
    left: 2%;
    bottom: 0;
    height: 88%;
    width: 24%;
    animation: bob 2.6s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .chef-girl svg { width: 100%; height: 100%; display: block; }
  .chef-girl.cheer { animation: cheer 0.7s ease; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3%); }
  }
  @keyframes cheer {
    0% { transform: scale(1) rotate(0); }
    30% { transform: scale(1.12) rotate(-4deg); }
    60% { transform: scale(1.12) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* ===== Order ticket text sits in note above; keep stats row ===== */
  .stats { margin-top: 4px; }

  /* ===== Ingredient tray ===== */
  .ingredient-tray {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 620px;
    margin: 14px auto;
  }
  .ingredient-btn {
    background: linear-gradient(180deg, #fff 0%, #f5eee0 100%);
    border: 3px solid var(--purple);
    border-radius: 50% / 45%;
    padding: 10px 12px 8px;
    font-size: 1.5rem;
    cursor: grab;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 62px;
    touch-action: none;
    user-select: none;
    transition: transform 0.12s ease;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  .ingredient-btn:hover { transform: translateY(-3px) scale(1.06); }
  .ingredient-btn:active { cursor: grabbing; }
  .ingredient-btn span.label {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--purple);
  }
  .drag-ghost {
    position: fixed;
    top: 0; left: 0;
    font-size: 2.1rem;
    transform: translate(-50%, -50%) scale(1.25);
    pointer-events: none;
    z-index: 999;
    filter: drop-shadow(0 5px 6px rgba(0,0,0,0.3));
  }

  .speak-bubble {
    position: fixed;
    left: 50%;
    top: 20%;
    transform: translate(-50%, -20px);
    background: var(--white);
    border: 4px solid var(--pink);
    border-radius: 16px;
    padding: 14px 26px;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--pink);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 50;
  }
  .speak-bubble.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .oven-progress {
    width: 90%;
    height: 8px;
    background: #222;
    border-radius: 999px;
    overflow: hidden;
    display: none;
  }
  .oven-progress .bar {
    height: 100%;
    width: 0%;
    background: var(--orange);
    transition: width 0.1s linear;
  }

  .confetti-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .confetti-bit {
    position: absolute;
    top: 30%;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: confetti-fall 1s ease-out forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(160px) rotate(300deg); opacity: 0; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">🎈 Kiddo Playground</div>
  <nav>
    <a href="../index.html">Home</a>
  </nav>
</header>

<main class="game-page">
  <h1>🍕 Pizza Maker</h1>
  <p>Drag ingredients onto the pizza (or just click one!) — Mia the chef will say each word out loud.</p>

  <div class="game-stage kitchen-stage">

    <div class="kitchen-scene" id="kitchenScene">
      <div class="wall">
        <div class="window"></div>
        <div class="shelf-wrap">
          <div class="jars">
            <span class="jar" style="--jc:#ffd93d"></span>
            <span class="jar" style="--jc:#ff6b9d"></span>
            <span class="jar" style="--jc:#4d96ff"></span>
          </div>
          <div class="shelf"></div>
        </div>
        <div class="order-note" id="orderTicket">Order: Loading...</div>
      </div>

      <div class="floor"></div>

      <div class="chef-girl" id="chefGirl">
        <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="252" rx="46" ry="8" fill="rgba(0,0,0,0.15)"/>
          <!-- legs -->
          <rect x="76" y="205" width="18" height="42" rx="9" fill="#7a56c9"/>
          <rect x="106" y="205" width="18" height="42" rx="9" fill="#7a56c9"/>
          <ellipse cx="85" cy="248" rx="16" ry="9" fill="#3a2a1a"/>
          <ellipse cx="115" cy="248" rx="16" ry="9" fill="#3a2a1a"/>
          <!-- pigtails -->
          <circle cx="46" cy="88" r="17" fill="#7a4a2b"/>
          <circle cx="154" cy="88" r="17" fill="#7a4a2b"/>
          <rect x="41" y="82" width="10" height="8" rx="3" fill="#ff6b9d"/>
          <rect x="149" y="82" width="10" height="8" rx="3" fill="#ff6b9d"/>
          <!-- body / apron -->
          <path d="M62,112 Q100,100 138,112 L148,222 Q100,238 52,222 Z" fill="#ff6b9d"/>
          <path d="M85,140 h30 a6,6 0 0 1 6,6 v18 a6,6 0 0 1 -6,6 h-30 a6,6 0 0 1 -6,-6 v-18 a6,6 0 0 1 6,-6 Z" fill="#fff8ef" opacity="0.95"/>
          <path d="M78,112 L70,96 M122,112 L130,96" stroke="#e94f86" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- arms -->
          <path d="M63,120 Q40,140 38,172" stroke="#ffd9b3" stroke-width="16" fill="none" stroke-linecap="round"/>
          <path d="M137,120 Q158,105 158,80" stroke="#ffd9b3" stroke-width="16" fill="none" stroke-linecap="round"/>
          <circle cx="158" cy="76" r="10" fill="#ffd9b3"/>
          <!-- hair back -->
          <path d="M56,62 Q58,14 100,14 Q142,14 144,62 Q144,40 100,38 Q56,40 56,62 Z" fill="#7a4a2b"/>
          <!-- head -->
          <circle cx="100" cy="66" r="40" fill="#ffd9b3"/>
          <!-- chef hat -->
          <circle cx="80" cy="14" r="17" fill="#fff" stroke="#e7e0d3" stroke-width="2"/>
          <circle cx="100" cy="6" r="20" fill="#fff" stroke="#e7e0d3" stroke-width="2"/>
          <circle cx="120" cy="14" r="17" fill="#fff" stroke="#e7e0d3" stroke-width="2"/>
          <rect x="70" y="20" width="60" height="14" rx="7" fill="#fff" stroke="#e7e0d3" stroke-width="2"/>
          <!-- face -->
          <circle cx="86" cy="66" r="4.5" fill="#3a2a1a"/>
          <circle cx="114" cy="66" r="4.5" fill="#3a2a1a"/>
          <ellipse cx="78" cy="78" rx="8" ry="5" fill="#ff9db8" opacity="0.6"/>
          <ellipse cx="122" cy="78" rx="8" ry="5" fill="#ff9db8" opacity="0.6"/>
          <path d="M88,84 Q100,94 112,84" stroke="#a15a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="counter">
        <div class="counter-top"></div>
        <div class="cabinet-face">
          <div class="cabinet-door"></div>
          <div class="oven-unit" id="ovenUnit">

            <div class="oven-progress" id="ovenProgress"><div class="bar" id="ovenBar"></div></div>

      <div class="pizza-pan">
        <div class="pizza-area no-dough" id="pizzaArea">

      <button class="ingredient-btn" data-type="sauce" data-word="sauce" data-emoji="🍅">🍅<span class="label">Sauce</span></button>
      <button class="ingredient-btn" data-type="cheese" data-word="cheese" data-emoji="🧀">🧀<span class="label">Cheese</span></button>
      <button class="ingredient-btn" data-type="topping" data-word="pepperoni" data-emoji="🔴">🔴<span class="label">Pepperoni</span></button>
      <button class="ingredient-btn" data-type="topping" data-word="mushroom" data-emoji="🍄">🍄<span class="label">Mushroom</span></button>
      <button class="ingredient-btn" data-type="topping" data-word="pepper" data-emoji="🫑">🫑<span class="label">Pepper</span></button>
      <button class="ingredient-btn" data-type="topping" data-word="olive" data-emoji="⚫">⚫<span class="label">Olive</span></button>
      <button class="ingredient-btn" data-type="topping" data-word="onion" data-emoji="🧅">🧅<span class="label">Onion</span></button>
      <button class="ingredient-btn" data-type="topping" data-word="pineapple" data-emoji="🍍">🍍<span class="label">Pineapple</span></button>
    </div>

    <div class="controls">
      <button class="btn" id="ovenBtn">Put in Oven 🔥</button>
      <button class="btn secondary" id="serveBtn">Serve Pizza 🍽️</button>
      <button class="btn" id="restartBtn">New Pizza</button>
      <a class="btn secondary" href="../index.html">Back Home</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  Made with 💜 for curious kids everywhere.
</footer>

<div class="speak-bubble" id="speakBubble"></div>

<script>
const TOPPING_WORDS = ['pepperoni','mushroom','pepper','olive','onion','pineapple'];
let hasDough = false;
let hasSauce = false;
let hasCheese = false;
let baked = false;
let toppingsAdded = new Set();
let placedToppings = [];
let pizzaCount = 0;
let currentOrder = [];

const pizzaArea = document.getElementById('pizzaArea');
const sauceLayer = document.getElementById('sauceLayer');
const cheeseLayer = document.getElementById('cheeseLayer');
const speakBubble = document.getElementById('speakBubble');
const ovenProgress = document.getElementById('ovenProgress');
const ovenBar = document.getElementById('ovenBar');
const ovenUnit = document.getElementById('ovenUnit');
const chefGirl = document.getElementById('chefGirl');
const confettiLayer = document.getElementById('confettiLayer');

function speakWord(word) {
  speakBubble.textContent = word;
  speakBubble.classList.add('show');
  setTimeout(() => speakBubble.classList.remove('show'), 1100);
  if ('speechSynthesis' in window) {
    const utter = new SpeechSynthesisUtterance(word);
    utter.rate = 0.85;
    utter.lang = 'en-US';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }
}

function newOrder() {
  const shuffled = [...TOPPING_WORDS].sort(() => Math.random() - 0.5);
  currentOrder = shuffled.slice(0, 2 + Math.floor(Math.random() * 2));
  document.getElementById('orderTicket').textContent =
    'Order: pizza with ' + currentOrder.join(', ');
}

// ---- Topping placement (spread evenly, avoid overlap, respect drop point) ----
function clampToPizza(pt) {
  const cx = 160, cy = 160, maxR = 118;
  const dx = pt.x - cx, dy = pt.y - cy;
  const d = Math.hypot(dx, dy);
  if (d <= maxR) return pt;
  const scale = maxR / d;
  return { x: cx + dx * scale, y: cy + dy * scale };
}

function pickToppingSpot(target) {
  const cx = 160, cy = 160, maxRadius = 118, minGap = 30;
  let best = null, bestDist = -1;

  for (let attempt = 0; attempt < 24; attempt++) {
    let x, y;
    if (target) {
      const jitter = 26;
      const raw = { x: target.x + (Math.random() * 2 - 1) * jitter, y: target.y + (Math.random() * 2 - 1) * jitter };
      const c = clampToPizza(raw);
      x = c.x; y = c.y;
    } else {
      const angle = Math.random() * 2 * Math.PI;
      const radius = maxRadius * Math.sqrt(Math.random());
      x = cx + radius * Math.cos(angle);
      y = cy + radius * Math.sin(angle);
    }

    let nearest = Infinity;
    for (const p of placedToppings) {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < nearest) nearest = d;
    }
    if (nearest >= minGap) return { x, y };
    if (nearest > bestDist) { bestDist = nearest; best = { x, y }; }
  }
  return best || { x: cx, y: cy };
}

function addTopping(word, emoji, dropPoint) {
  if (!hasDough || baked) return;
  toppingsAdded.add(word);
  for (let i = 0; i < 3; i++) {
    const spot = pickToppingSpot(dropPoint);
    placedToppings.push(spot);
    const el = document.createElement('div');
    el.className = 'topping';
    el.textContent = emoji;
    el.style.left = (spot.x / 320 * 100) + '%';
    el.style.top = (spot.y / 320 * 100) + '%';
    el.style.transform = `translate(-50%, -50%) rotate(${Math.round(Math.random() * 40 - 20)}deg)`;
    pizzaArea.appendChild(el);
  }
}

// ---- Ingredient action (shared by drag-drop, click, and keyboard) ----
function handleIngredientAction(data, dropPoint) {
  speakWord(data.word);
  if (baked) return;
  if (data.type === 'dough') {
    hasDough = true;
    pizzaArea.classList.remove('no-dough');
  } else if (data.type === 'sauce') {
    if (!hasDough) return;
    hasSauce = true;
    sauceLayer.classList.add('on');
  } else if (data.type === 'cheese') {
    if (!hasDough) return;
    hasCheese = true;
    cheeseLayer.classList.add('on');
  } else if (data.type === 'topping') {
    addTopping(data.word, data.emoji, dropPoint);
  }
}

// ---- Drag and drop with Pointer Events (mouse + touch), click as fallback ----
let dragGhost = null;
let dragData = null;
let dragStartX = 0, dragStartY = 0;
let suppressClick = false;

document.querySelectorAll('.ingredient-btn').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dragData = {
      type: btn.dataset.type,
      word: btn.dataset.word,
      emoji: btn.dataset.emoji
    };
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragGhost = document.createElement('div');
    dragGhost.className = 'drag-ghost';
    dragGhost.textContent = dragData.emoji;
    document.body.appendChild(dragGhost);
    positionGhost(e.clientX, e.clientY);
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp, { once: true });
    document.addEventListener('pointercancel', onPointerCancel, { once: true });
  });

  btn.addEventListener('click', () => {
    if (suppressClick) { suppressClick = false; return; }
    handleIngredientAction({
      type: btn.dataset.type,
      word: btn.dataset.word,
      emoji: btn.dataset.emoji
    }, null);
  });
});

function positionGhost(x, y) {
  if (!dragGhost) return;
  dragGhost.style.left = x + 'px';
  dragGhost.style.top = y + 'px';
}

function onPointerMove(e) {
  positionGhost(e.clientX, e.clientY);
}

function onPointerUp(e) {
  document.removeEventListener('pointermove', onPointerMove);
  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
  if (!dragData) return;

  const rect = pizzaArea.getBoundingClientRect();
  const overPizza = e.clientX >= rect.left && e.clientX <= rect.right &&
                     e.clientY >= rect.top && e.clientY <= rect.bottom;
  let dropPoint = null;
  if (overPizza) {
    const fx = (e.clientX - rect.left) / rect.width;
    const fy = (e.clientY - rect.top) / rect.height;
    dropPoint = { x: fx * 320, y: fy * 320 };
  }
  handleIngredientAction(dragData, dropPoint);
  dragData = null;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 50);
}

function onPointerCancel() {
  document.removeEventListener('pointermove', onPointerMove);
  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
  dragData = null;
}

// ---- Oven ----
document.getElementById('ovenBtn').addEventListener('click', () => {
  if (!hasDough || baked) return;
  ovenProgress.style.display = 'block';
  ovenUnit.classList.add('active');
  let pct = 0;
  const iv = setInterval(() => {
    pct += 4;
    ovenBar.style.width = pct + '%';
    if (pct >= 100) {
      clearInterval(iv);
      baked = true;
      pizzaArea.classList.add('baked');
      ovenUnit.classList.remove('active');
      speakWord('yummy');
    }
  }, 80);
});

// ---- Serve ----
function burstConfetti() {
  const colors = ['#ff6b9d', '#ffa62b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b5de5'];
  for (let i = 0; i < 18; i++) {
    const bit = document.createElement('div');
    bit.className = 'confetti-bit';
    bit.style.left = (10 + Math.random() * 80) + '%';
    bit.style.background = colors[Math.floor(Math.random() * colors.length)];
    bit.style.animationDelay = (Math.random() * 0.2) + 's';
    confettiLayer.appendChild(bit);
    setTimeout(() => bit.remove(), 1300);
  }
}

document.getElementById('serveBtn').addEventListener('click', () => {
  if (!baked) {
    alert('Bake the pizza first! 🔥');
    return;
  }
  const missing = currentOrder.filter(t => !toppingsAdded.has(t));
  if (missing.length === 0) {
    pizzaCount++;
    document.getElementById('pizzaCount').textContent = pizzaCount;
    chefGirl.classList.remove('cheer');
    void chefGirl.offsetWidth;
    chefGirl.classList.add('cheer');
    burstConfetti();
    alert('🎉 Perfect pizza! Order complete!');
  } else {
    alert('Hmm, missing: ' + missing.join(', ') + ' — try again!');
  }
});

document.getElementById('restartBtn').addEventListener('click', resetPizza);

function resetPizza() {
  hasDough = false;
  hasSauce = false;
  hasCheese = false;
  baked = false;
  toppingsAdded = new Set();
  placedToppings = [];
  pizzaArea.classList.add('no-dough');
  pizzaArea.classList.remove('baked');
  sauceLayer.classList.remove('on');
  cheeseLayer.classList.remove('on');
  ovenProgress.style.display = 'none';
  ovenBar.style.width = '0%';
  ovenUnit.classList.remove('active');
  document.querySelectorAll('.topping').forEach(t => t.remove());
  newOrder();
}

newOrder();
</script>
