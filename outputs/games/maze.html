<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maze Runner - Kiddo Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<style>
  .maze-grid {
    display: grid;
    gap: 2px;
    margin: 0 auto;
    width: fit-content;
    background: var(--purple);
    padding: 4px;
    border-radius: 12px;
  }
  .cell {
    width: 34px;
    height: 34px;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }
  .cell.wall { background: var(--purple); }
  .cell.goal { background: var(--yellow); }
  .cell.player { background: var(--blue); }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(2, 50px);
    gap: 6px;
    justify-content: center;
    margin-top: 16px;
  }
  .dpad button {
    font-size: 1.4rem;
    border: none;
    border-radius: 10px;
    background: var(--green);
    color: white;
    cursor: pointer;
  }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">🎈 Kiddo Playground</div>
  <nav>
    <a href="../index.html">Home</a>
  </nav>
</header>

<main class="game-page">
  <h1>🌀 Maze Runner</h1>
  <p>Use the arrow keys or buttons to reach the treasure! 🏆</p>

  <div class="game-stage">
    <div class="stats">
      <div>Level: <span id="levelNum">1</span> / 3</div>
      <div>Moves: <span id="moves">0</span></div>
    </div>
    <div class="maze-grid" id="mazeGrid"></div>
    <div class="dpad">
      <button class="up" data-dir="up">⬆️</button>
      <button class="left" data-dir="left">⬅️</button>
      <button class="down" data-dir="down">⬇️</button>
      <button class="right" data-dir="right">➡️</button>
    </div>
    <div class="controls">
      <button class="btn" id="restartBtn">Restart Level</button>
      <a class="btn secondary" href="../index.html">Back Home</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  Made with 💜 for curious kids everywhere.
</footer>

<script>
// 1 = wall, 0 = open, S = start, G = goal
const LEVELS = [
  [
    "1111111",
    "1S00001",
    "1011101",
    "1000101",
    "1110101",
    "10000G1",
    "1111111"
  ],
  [
    "111111111",
    "1S0000001",
    "1011111G1",
    "100000101",
    "101110101",
    "100010001",
    "111111111"
  ],
  [
    "1111111111",
    "1S00000001",
    "1011111101",
    "1010000101",
    "1010111101",
    "1000100101",
    "1111101G01",
    "1111111111"
  ]
];

let levelIdx = 0;
let grid = [];
let playerPos = { r: 0, c: 0 };
let goalPos = { r: 0, c: 0 };
let moves = 0;

function loadLevel(idx) {
  const rows = LEVELS[idx];
  grid = rows.map(row => row.split(''));
  moves = 0;
  document.getElementById('moves').textContent = 0;
  document.getElementById('levelNum').textContent = idx + 1;

  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      if (grid[r][c] === 'S') { playerPos = { r, c }; grid[r][c] = '0'; }
      if (grid[r][c] === 'G') { goalPos = { r, c }; }
    }
  }
  render();
}

function render() {
  const container = document.getElementById('mazeGrid');
  const cols = grid[0].length;
  container.style.gridTemplateColumns = `repeat(${cols}, 34px)`;
  container.innerHTML = '';
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (grid[r][c] === '1') cell.classList.add('wall');
      if (r === goalPos.r && c === goalPos.c) { cell.classList.add('goal'); cell.textContent = '🏆'; }
      if (r === playerPos.r && c === playerPos.c) { cell.classList.add('player'); cell.textContent = '🙂'; }
      container.appendChild(cell);
    }
  }
}

function move(dir) {
  const deltas = { up: [-1,0], down: [1,0], left: [0,-1], right: [0,1] };
  const [dr, dc] = deltas[dir];
  const nr = playerPos.r + dr;
  const nc = playerPos.c + dc;
  if (grid[nr] && grid[nr][nc] && grid[nr][nc] !== '1') {
    playerPos = { r: nr, c: nc };
    moves++;
    document.getElementById('moves').textContent = moves;
    render();
    if (nr === goalPos.r && nc === goalPos.c) {
      setTimeout(() => {
        if (levelIdx < LEVELS.length - 1) {
          alert(`Level ${levelIdx + 1} complete! 🎉 Next level...`);
          levelIdx++;
          loadLevel(levelIdx);
        } else {
          alert(`🏆 You beat all levels in ${moves} moves! 🏆`);
        }
      }, 100);
    }
  }
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

document.querySelectorAll('.dpad button').forEach(btn => {
  btn.addEventListener('click', () => move(btn.dataset.dir));
});

document.getElementById('restartBtn').addEventListener('click', () => loadLevel(levelIdx));

loadLevel(0);
</script>

</body>
</html>
