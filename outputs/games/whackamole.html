<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Whack-a-Mole - Kiddo Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<style>
  .mole-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 420px;
    margin: 0 auto;
  }
  .hole {
    aspect-ratio: 1 / 1;
    background: #8b5a2b;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    cursor: pointer;
    overflow: hidden;
    box-shadow: inset 0 6px 10px rgba(0,0,0,0.3);
  }
  .hole .mole {
    transform: scale(0);
    transition: transform 0.15s ease;
  }
  .hole.up .mole {
    transform: scale(1);
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">🎈 Kiddo Playground</div>
  <nav>
    <a href="../index.html">Home</a>
  </nav>
</header>

<main class="game-page">
  <h1>🐹 Whack-a-Mole</h1>
  <p>Click the moles as fast as you can before time runs out!</p>

  <div class="game-stage">
    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Time: <span id="time">30</span>s</div>
    </div>
    <div class="mole-grid" id="moleGrid"></div>
    <div class="controls">
      <button class="btn" id="startBtn">Start Game</button>
      <a class="btn secondary" href="../index.html">Back Home</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  Made with 💜 for curious kids everywhere.
</footer>

<script>
const HOLE_COUNT = 9;
let score = 0;
let timeLeft = 30;
let timerInterval = null;
let moleInterval = null;
let activeHole = null;
let playing = false;

const grid = document.getElementById('moleGrid');
for (let i = 0; i < HOLE_COUNT; i++) {
  const hole = document.createElement('div');
  hole.className = 'hole';
  hole.innerHTML = '<span class="mole">🐹</span>';
  hole.addEventListener('click', () => whack(hole));
  grid.appendChild(hole);
}
const holes = [...grid.children];

function whack(hole) {
  if (!playing || !hole.classList.contains('up')) return;
  score++;
  document.getElementById('score').textContent = score;
  hole.classList.remove('up');
}

function popRandomMole() {
  if (activeHole) activeHole.classList.remove('up');
  const hole = holes[Math.floor(Math.random() * holes.length)];
  hole.classList.add('up');
  activeHole = hole;
}

function startGame() {
  if (playing) return;
  playing = true;
  score = 0;
  timeLeft = 30;
  document.getElementById('score').textContent = 0;
  document.getElementById('time').textContent = timeLeft;

  moleInterval = setInterval(popRandomMole, 750);
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('time').textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  playing = false;
  clearInterval(timerInterval);
  clearInterval(moleInterval);
  holes.forEach(h => h.classList.remove('up'));
  document.getElementById('time').textContent = 'Done!';
  alert(`Time's up! Final score: ${score} 🎉`);
}

document.getElementById('startBtn').addEventListener('click', startGame);
</script>

</body>
</html>
